name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: chmod +x gradlew && ./gradlew android:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: spd-apk
          path: android/build/outputs/apk/debug/*.apk
      - name: ⚠️ Note SDK Android
        run: |-
          echo 'Si build échoue : SDK Android manquant'
          echo 'Sur votre PC : installez Android Studio'
          echo 'Ou utilisez le .jar + Javelin sur Android'
          echo 'Voir les instructions précédentes'